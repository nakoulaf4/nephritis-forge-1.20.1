pluginManagement {
    repositories {
        gradlePluginPortal()
        maven { url = 'https://maven.minecraftforge.net' }
        maven { url = 'https://repo.spongepowered.org/repository/maven-public/' }
    }
}

plugins {
    // Auto-provisions the Java 17 toolchain required by MC 1.20.1 when the
    // host only ships a newer JDK. Build-time convenience only.
    id 'org.gradle.toolchains.foojay-resolver-convention' version '0.8.0'
}

rootProject.name = 'nephritis-forge-1.20.1'
